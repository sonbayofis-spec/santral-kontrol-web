var SECNOTE={
 saf:S("Güneş panelleri ışık oldukça gerilim üretir. İnvertör kapalı olsa bile DC kablolar tehlikelidir; DC tarafında çalışmadan önce üretimin kesildiğini ve sorumlunun izin verdiğini teyit et.","Panourile produc tensiune cât timp există lumină. Chiar cu invertorul oprit, cablurile DC sunt periculoase; înainte de lucrări pe partea DC confirmă că producția este oprită și că responsabilul a dat acordul."),
 tour:S("Üretim düşüşünde önce havaya bak: bulutlu günde düşük üretim normaldir. Güneşli saatte yan yana iki invertör arasında belirgin fark varsa sorun sahadadır.","La scăderea producției verifică întâi vremea: într-o zi noroasă producția mică e normală. Dacă la soare două invertoare vecine diferă mult, problema este în parc."),
 per:S("Kuru ot yangın riskidir; yazın otları sık kes.","Iarba uscată este risc de incendiu; vara taie iarba des."),
 pv:S("Panellerin üstüne basılmaz. Temizlik sabah erken veya akşam yapılır; öğle sıcağında soğuk su camı çatlatabilir.","Nu se calcă pe panouri. Curățarea se face dimineața devreme sau seara; apa rece la prânz poate crăpa sticla."),
 dc:S("Gerilim ve akım ölçümünü yalnızca yetkili ve uygun donanımlı kişi yapar. Yeni teknisyen bu işlerde ilk dönem gözlemcidir.","Măsurătorile de tensiune și curent le face doar persoana autorizată, cu echipament potrivit. Noul tehnician este inițial doar observator."),
 inv:S("Kabinin içine ve DC/AC bağlantılara yalnızca yetkili kişi, enerji kesildikten ve bekleme süresi geçtikten sonra müdahale eder. Hata kodunu sıfırlamadan önce kodu ve saati kaydet.","În carcasă și la conexiunile DC/AC intervine doar persoana autorizată, după deconectare și după timpul de așteptare. Înainte de resetare notează codul de eroare și ora."),
 ac:S("Teknisyen bu bölümde yalnızca dışarıdan gözlem yapar. Koruma rölesi açtıysa veya trafo alarm veriyorsa kendi başına enerjilendirme yapma, sorumluya haber ver.","Aici tehnicianul doar observă din exterior. Dacă releul a declanșat sau transformatorul dă alarmă, nu reenergiza singur; anunță responsabilul."),
 mon:S("Güneşli, açık günde iki aynı invertör arasında %5'ten fazla fark varsa sahaya bak; bulut geçişi değil, kirlilik, gölge, sigorta veya konnektör sorunudur.","Dacă într-o zi senină două invertoare identice diferă cu peste 5%, verifică în parc; nu e de la nori, ci de la murdărie, umbră, siguranță sau conector."),
 rev:S("Satış sayacının plombasına ve kabinine kimse dokunmaz.","Nimeni nu atinge sigiliul și dulapul contorului de vânzare."),
 sg:S("10 kV kesici, koruma rölesi ayarları, CUT-OUT ve 46/1 direği çalışmaları yalnızca yetkili elektrik personelince, Premier Energy Distribution ile koordinasyonla yapılır. Teknisyen bu kısımlarda gözler ve bildirir.","Lucrările la întreruptorul de 10 kV, setările releului, CUT-OUT și stâlpul 46/1 le fac doar electricienii autorizați, în coordonare cu Premier Energy Distribution. Tehnicianul doar observă și raportează.")

function docId(f,k){return park+"__"+f+"__"+k}
function blank(f,k){return {park:park,freq:f,key:k,items:{},note:"",visited:"",signedName:"",signedAt:0,updatedAt:0}}
function getDoc(f,k){var id=docId(f,k);var p=pend.get(id);return (p&&p.doc)||logs.get(id)||blank(f,k)}
function itemsFor(f){return ITEMS.filter(function(i){return i.f===f&&(!i.p||i.p===park)})}
function setStatus(s){saveState=s;clearTimeout(statusTimer);paintStatus();if(s==="saved")statusTimer=setTimeout(function(){saveState="";paintStatus()},1800)}
function paintStatus(){var s=document.getElementById("status");if(!s)return;s.textContent="";if(!saveState)return;s.append(el("span",{text:L(UI[saveState])}))}
function edit(f,fn){
  var k=keyFor(f,date),id=docId(f,k);
  var base=JSON.parse(JSON.stringify(getDoc(f,k)));fn(base);
  base.park=park;base.freq=f;base.key=k;base.updatedAt=Date.now();
  var e=pend.get(id)||{v:0};e.doc=base;e.v++;pend.set(id,e);
  clearTimeout(e.t);e.t=setTimeout(function(){flush(id)},450);
  setStatus(db?"saving":"local");
}
async function flush(id){
  var e=pend.get(id);if(!e||e.busy)return;
  if(!db){return}
  e.busy=true;var v=e.v;
  try{await db.doc("logs/"+id).set(e.doc)}catch(err){e.busy=false;setStatus("fail");if(err&&err.code==="invalid_argument")canWrite=false;render();return}
  e.busy=false;
  if(e.v===v){logs.set(id,e.doc);pend.delete(id);setStatus("saved")}else flush(id);
}
function counts(f,d){
  var its=itemsFor(f).filter(function(i){return f!=="d"||d.visited==="yes"||i.r});
  var ok=0,bad=0;its.forEach(function(i){var s=d.items[i.id];if(s==="ok")ok++;else if(s==="issue")bad++});
  return {total:its.length,ok:ok,bad:bad,left:its.length-ok-bad};
}
